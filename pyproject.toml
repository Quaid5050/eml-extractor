[project]
name = "eml-extractor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<6",
]

# https://vercel.com/docs/frameworks/full-stack/django#configure-the-django-entrypoint
[tool.vercel]
entrypoint = "api/wsgi.py:application"

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
